# Overlay for resolving quarantine by hand.
#
# Layered over beets-pi.yaml with a second -c, which beets merges:
#
#   docker compose exec -it nyx-api \
#     beet -c /config/beets.yaml -c /config/interactive.yaml \
#     import /import/quarantine/<batch-id>
#
# The automatic import refuses to guess, which is what keeps it safe to run
# unattended. This turns that off, because a person is now present to make the
# judgement calls beets could not — which is the whole reason quarantine
# exists rather than a best guess.
import:
  quiet: no
  timid: no
  # Ask about duplicates rather than skipping them silently.
  duplicate_action: ask

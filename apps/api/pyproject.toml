[project]
name = "nyx-api"
version = "0.1.0"
description = "Play history, statistics and enrichment cache for Nyx Audio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # Import pipeline. pyacoustid needs the fpcalc binary from the image.
    "beets>=2.2",
    "pyacoustid>=1.3",
    "requests>=2.32",
    "pillow>=10.4",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyx_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

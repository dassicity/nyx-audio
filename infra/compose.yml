# Nyx Audio — Raspberry Pi 5 stack
#
#   docker compose up -d
#
# Caddy is the ONLY published entry point. Navidrome is reachable solely on the
# internal network, so the Subsonic API and the client always share one origin
# and CORS never enters the picture.
#
# Services marked (v1) do not exist yet. They are written out so the file grows
# into the architecture in docs/tech-stack.md instead of being rewritten.

name: nyx

services:
  # ── Library server: scanning, tags, cover art, transcoding, audio bytes ──
  navidrome:
    image: deluan/navidrome:latest   # pin to a digest after the first good boot
    container_name: nyx-navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # The library changes rarely — a daily sweep plus the filesystem watcher
      # is plenty. Manual rescans are available in the Navidrome UI.
      ND_SCANSCHEDULE: "@every 24h"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      # Read ReplayGain tags written by beets rather than recomputing them.
      ND_ENABLETRANSCODINGCONFIG: "false"
      TZ: "${TZ:-Asia/Kolkata}"
    volumes:
      # READ-ONLY, deliberately. A bug must never be able to delete the library.
      - "${MUSIC_DIR:-/srv/music}:/music:ro"
      # A bind mount, NOT a named volume. Docker creates a named volume's
      # mountpoint as root:root, so a container running as UID 1000 cannot
      # write its database there — Navidrome fails with "database could not be
      # opened". A host directory you chown yourself has no such problem, and
      # it is easier to back up and inspect.
      - "${DATA_DIR:-/srv/nyx}/navidrome:/data"
    networks: [nyx]
    # No custom healthcheck. The upstream image may not contain wget or curl,
    # and a healthcheck that cannot run reports "unhealthy" forever — which,
    # combined with a `service_healthy` gate below, takes down the whole stack
    # while Navidrome is in fact running fine. Not worth the failure mode.

  # ── Single entry point: static client, API routing, TLS ──
  caddy:
    image: caddy:2-alpine
    container_name: nyx-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Per-machine generated config (Tailscale HTTPS). Gitignored.
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy-data:/data          # certificates and ACME state — do not delete
      - caddy-config:/config
      # Tailscale certificates. Gitignored — the key must never be committed.
      - ./caddy/certs:/certs:ro
      # The built client, rsynced from the laptop by ./deploy-web.sh.
      - "${WEB_DIR:-/srv/nyx/web}:/srv/nyx-web:ro"
    # Start-order only. Caddy 502s for the few seconds before Navidrome is
    # listening, then works — far better than refusing to start at all.
    depends_on:
      - navidrome
    networks: [nyx]

  # ── (v1) Play history, enrichment cache, crate selection, statistics ──
  # Never touches audio bytes — that is what keeps the language choice free.
  # nyx-api:
  #   image: ghcr.io/OWNER/nyx-api:latest
  #   container_name: nyx-api
  #   restart: unless-stopped
  #   user: "${PUID:-1000}:${PGID:-1000}"
  #   environment:
  #     NYX_DB: /data/nyx.db
  #     NAVIDROME_URL: http://navidrome:4533
  #     TZ: "${TZ:-Asia/Kolkata}"
  #   volumes:
  #     - "${DATA_DIR:-/srv/nyx}/api:/data"
  #   networks: [nyx]

volumes:
  # Caddy runs as root, so named volumes are fine here.
  caddy-data:
  caddy-config:

networks:
  nyx:
    driver: bridge
